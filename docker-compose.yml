services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/PlantOps.Api/Dockerfile
    environment:
      ConnectionStrings__PlantOps: Server=sql,1433;Database=PlantOps;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Auth__JwtSigningKey: ${JWT_SIGNING_KEY}
      Auth__JwtIssuer: PlantOps
      Auth__JwtAudience: PlantOps
      Auth__OperatorUsername: ${OPERATOR_USERNAME}
      Auth__OperatorPassword: ${OPERATOR_PASSWORD}
      Auth__SupervisorUsername: ${SUPERVISOR_USERNAME}
      Auth__SupervisorPassword: ${SUPERVISOR_PASSWORD}
      Auth__TokenHours: "8"
      Simulator__Enabled: "true"
      Simulator__IntervalSeconds: "15"
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      Cors__Origin: http://localhost:3000
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
