trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

stages:
  - stage: Build
    jobs:
      - job: Api
        steps:
          - task: UseDotNet@2
            displayName: Install .NET 8
            inputs:
              packageType: sdk
              version: 8.0.x
          - script: dotnet test PlantOps.sln -c $(buildConfiguration)
            displayName: Test API
          - script: docker build -f src/PlantOps.Api/Dockerfile -t plantops-api:$(Build.BuildId) .
            displayName: Build API image

      - job: Web
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 22.x
          - script: npm ci
            workingDirectory: src/web
            displayName: Install web dependencies
          - script: npm run build
            workingDirectory: src/web
            displayName: Build web app
          - script: docker build -f Dockerfile -t plantops-web:$(Build.BuildId) .
            workingDirectory: src/web
            displayName: Build web image

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployBicep
        steps:
          - task: AzureCLI@2
            displayName: Deploy Bicep template
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group create \
                  --resource-group $(RESOURCE_GROUP) \
                  --template-file infra/main.bicep \
                  --parameters \
                    sqlAdminLogin=$(SQL_ADMIN_LOGIN) \
                    sqlAdminPassword=$(SQL_ADMIN_PASSWORD) \
                    jwtSigningKey=$(JWT_SIGNING_KEY) \
                    operatorPassword=$(OPERATOR_PASSWORD) \
                    supervisorPassword=$(SUPERVISOR_PASSWORD) \
                    deployerPrincipalId=$(DEPLOYER_OBJECT_ID)
